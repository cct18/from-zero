<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{PROJECT_NAME}} — 从零构建交互式教程</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       1. ANTHROPIC CLAUDE 人文出版物视觉设计系统 (Design Tokens)
       ========================================================================== */
    :root {
      --bg-primary: #FAF9F5;
      --bg-surface: #FFFFFF;
      --bg-elevated: #F6F4EE;
      --bg-muted: #EFECE6;
      --bg-code: #F3F1EB;
      --bg-terminal: #191817;

      --text-primary: #1F1E1D;
      --text-secondary: #5F5D56;
      --text-muted: #8E8B82;
      --text-on-accent: #FFFFFF;

      --border-subtle: #E8E6DF;
      --border-strong: #D5D2C8;

      --accent-terracotta: #D97757;
      --accent-terracotta-hover: #C46344;
      --accent-terracotta-soft: #F8EFEA;
      --accent-terracotta-border: #EBC9B8;

      --accent-sand: #D99B52;
      --accent-sand-soft: #FBF5EC;

      --accent-sage: #52734D;
      --accent-sage-soft: #EEF4EC;

      --accent-danger: #C24E42;
      --accent-danger-soft: #FBECE9;

      /* 语法高亮 (暖书卷色调) */
      --syn-kw: #B5492B;
      --syn-str: #486B43;
      --syn-num: #9E6A21;
      --syn-com: #8E8B82;
      --syn-fn: #375A7F;
      --syn-tag: #9E472A;

      --shadow-card: 0 1px 3px rgba(31, 30, 29, 0.04), 0 1px 2px rgba(31, 30, 29, 0.02);
      --shadow-elevated: 0 8px 24px rgba(31, 30, 29, 0.07);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;

      --font-serif: "Newsreader", "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "Microsoft YaHei", "Charter", "Georgia", serif;
      --font-sans: "Inter", "PingFang SC", "HarmonyOS Sans SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", Consolas, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", monospace;

      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --duration-fast: 180ms;
      --duration-normal: 280ms;
    }

    [data-theme="dark"] {
      --bg-primary: #191817;
      --bg-surface: #242220;
      --bg-elevated: #2C2926;
      --bg-muted: #1E1D1B;
      --bg-code: #1E1D1B;
      --bg-terminal: #121110;

      --text-primary: #E5E3DE;
      --text-secondary: #A8A49B;
      --text-muted: #78746C;
      --text-on-accent: #191817;

      --border-subtle: #383532;
      --border-strong: #4A4642;

      --accent-terracotta: #E08365;
      --accent-terracotta-hover: #EB9579;
      --accent-terracotta-soft: rgba(224, 131, 101, 0.14);
      --accent-terracotta-border: rgba(224, 131, 101, 0.35);

      --accent-sand: #E5B47A;
      --accent-sand-soft: rgba(229, 180, 122, 0.14);

      --accent-sage: #87A380;
      --accent-sage-soft: rgba(135, 163, 128, 0.14);

      --accent-danger: #E06C60;
      --accent-danger-soft: rgba(224, 108, 96, 0.14);

      --syn-kw: #EB9579;
      --syn-str: #97BA90;
      --syn-num: #E5B47A;
      --syn-com: #78746C;
      --syn-fn: #8BB4D9;
      --syn-tag: #EB9579;

      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.25);
      --shadow-elevated: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ==========================================================================
       2. 基础重置与书卷排版
       ========================================================================== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.76;
      -webkit-font-smoothing: antialiased;
      transition: background-color var(--duration-normal) var(--ease-out-expo),
                  color var(--duration-normal) var(--ease-out-expo);
    }

    h1, h2, h3, .serif-title {
      font-family: var(--font-serif);
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--text-primary);
    }
    h1 { font-size: clamp(1.9rem, 3vw, 2.55rem); line-height: 1.24; margin-bottom: 0.85rem; }
    h2 { font-size: clamp(1.4rem, 2.2vw, 1.78rem); line-height: 1.3; margin-bottom: 0.7rem; }
    h3 { font-size: 1.15rem; line-height: 1.4; margin-bottom: 0.48rem; }
    h4 { font-size: 0.98rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.35rem; }

    p { color: var(--text-secondary); margin-bottom: 0.95rem; max-width: 74ch; line-height: 1.82; }
    ul, ol { color: var(--text-secondary); padding-left: 1.25rem; margin-bottom: 0.95rem; }
    li { margin-bottom: 0.35rem; }
    svg text { font-family: var(--font-sans); }

    code, pre { font-family: var(--font-mono); font-size: 0.86em; }
    p code, li code, td code, th code, h1 code, h2 code, h3 code, h4 code, .jit-concept code, .deep-dive code, .callout-note code, .sandbox-guide code {
      background: var(--bg-code);
      color: var(--text-primary);
      padding: 0.05em 0.34em;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
      font-size: 0.84em;
      line-height: 1.2;
      vertical-align: 0.03em;
    }
    h1 code, h2 code, h3 code, h4 code {
      font-size: 0.82em;
      padding: 0.04em 0.3em;
    }

    /* ==========================================================================
       3. 双栏出版物基座与响应式侧栏
       ========================================================================== */
    .mobile-topbar {
      display: none;
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.75rem 1rem;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 276px minmax(0, 1fr);
      min-height: 100vh;
      max-width: 1420px;
      margin: 0 auto;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 1.85rem 1.3rem;
      border-right: 1px solid var(--border-subtle);
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .brand-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--accent-terracotta);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.35rem;
      font-weight: 600;
    }
    .brand-title {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
      margin-bottom: 0.35rem;
    }
    .brand-sub { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 0; }

    .nav-list { list-style: none; padding-left: 0; display: flex; flex-direction: column; gap: 0.25rem; margin-top: 1.1rem; }
    .nav-link {
      display: flex; align-items: center; gap: 0.55rem; padding: 0.5rem 0.7rem;
      border-radius: var(--radius-sm); color: var(--text-secondary); text-decoration: none;
      font-size: 0.85rem; line-height: 1.35; border-left: 3px solid transparent;
      transition: all var(--duration-fast) var(--ease-out-expo);
    }
    .nav-link:hover { background: var(--bg-elevated); color: var(--text-primary); }
    .nav-link.active {
      background: var(--accent-terracotta-soft); color: var(--accent-terracotta);
      border-left-color: var(--accent-terracotta); font-weight: 600;
    }
    .nav-num { font-family: var(--font-mono); font-size: 0.72rem; opacity: 0.8; min-width: 1.35rem; }

    .progress-box { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 0.85rem; box-shadow: var(--shadow-card); }
    .progress-header { display: flex; justify-content: space-between; font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-secondary); margin-bottom: 0.45rem; }
    .progress-track { height: 6px; background: var(--bg-muted); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: var(--accent-terracotta); transition: width var(--duration-normal) var(--ease-out-expo); }
    .sidebar-actions { display: flex; gap: 0.5rem; margin-top: 0.7rem; }

    .main-canvas { padding: 2.75rem clamp(1.25rem, 4vw, 3.25rem) 5rem; max-width: 980px; width: 100%; }
    .section-block { padding-bottom: 3.5rem; margin-bottom: 3.5rem; border-bottom: 1px solid var(--border-subtle); scroll-margin-top: 1.5rem; }
    .section-block:last-child { border-bottom: none; margin-bottom: 0; }
    .section-eyebrow {
      display: inline-block; font-family: var(--font-mono); font-size: 0.74rem;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-terracotta);
      margin-bottom: 0.45rem; font-weight: 600;
    }

    @media (max-width: 920px) {
      .mobile-topbar { display: flex; }
      .app-shell { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed; left: 0; top: 0; bottom: 0; width: 280px; z-index: 60;
        transform: translateX(-105%); transition: transform var(--duration-normal) var(--ease-out-expo);
        box-shadow: var(--shadow-elevated);
      }
      .sidebar.open { transform: translateX(0); }
      .main-canvas { padding: 1.75rem 1.15rem 4rem; }
      .section-block { scroll-margin-top: 4.2rem; }
    }

    /* ==========================================================================
       4. 通用基础与高密度可选原语样式 (按项目需要自由选用，绝不强求凑齐)
       ========================================================================== */
    .fz-card {
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg); padding: 1.35rem; box-shadow: var(--shadow-card); margin-bottom: 1.25rem;
    }
    .fz-card-header { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .fz-hint { font-size: 0.8rem; color: var(--text-muted); }

    .fz-badge-mono, .fz-badge-terracotta, .fz-badge-sage, .fz-badge-danger {
      display: inline-flex; align-items: center; gap: 0.3rem; font-family: var(--font-mono);
      font-size: 0.74rem; padding: 0.2rem 0.55rem; border-radius: 999px; font-weight: 500;
    }
    .fz-badge-mono { background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border-subtle); }
    .fz-badge-terracotta { background: var(--accent-terracotta-soft); color: var(--accent-terracotta); border: 1px solid var(--accent-terracotta-border); }
    .fz-badge-sage { background: var(--accent-sage-soft); color: var(--accent-sage); border: 1px solid rgba(82, 115, 77, 0.25); }
    .fz-badge-danger { background: var(--accent-danger-soft); color: var(--accent-danger); border: 1px solid rgba(194, 78, 66, 0.28); }

    .fz-btn {
      display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.44rem 0.85rem;
      border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--bg-surface);
      color: var(--text-primary); font-family: var(--font-sans); font-size: 0.82rem; font-weight: 500;
      cursor: pointer; transition: all var(--duration-fast) var(--ease-out-expo);
    }
    .fz-btn:hover:not(:disabled) { border-color: var(--accent-terracotta-border); background: var(--bg-elevated); transform: translateY(-1px); }
    .fz-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .fz-btn-primary { background: var(--accent-terracotta); border-color: var(--accent-terracotta); color: var(--text-on-accent); }
    .fz-btn-primary:hover:not(:disabled) { background: var(--accent-terracotta-hover); border-color: var(--accent-terracotta-hover); }

    .sticky-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 1.5rem; align-items: start; margin: 1.25rem 0; }
    .sticky-pane { position: sticky; top: 1.5rem; }
    @media (max-width: 860px) { .sticky-split { grid-template-columns: 1fr; } .sticky-pane { position: static; } }

    .two-col-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin: 1rem 0 1.25rem; }

    .callout-note {
      background: var(--bg-elevated); border-left: 3px solid var(--accent-terracotta);
      border-radius: 0 var(--radius-md) var(--radius-md) 0; padding: 1rem 1.15rem; margin: 1.15rem 0;
    }

    .jit-concept {
      background: var(--accent-sand-soft); border: 1px solid rgba(217, 155, 82, 0.35);
      border-radius: var(--radius-md); padding: 0.95rem 1.15rem; margin: 0.95rem 0; font-size: 0.9rem;
    }
    .jit-concept-title { font-weight: 600; color: var(--text-primary); margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }

    .duty-list { list-style: none; padding-left: 0; margin: 0.65rem 0; }
    .duty-list li { padding: 0.34rem 0; border-bottom: 1px dashed var(--border-subtle); color: var(--text-primary); font-size: 0.9rem; }
    .duty-list li:last-child { border-bottom: none; }

    /* 可选高密度原语 1：行内术语微释义 (.term-chip) */
    .term-chip {
      display: inline-flex; align-items: center; gap: 0.2rem;
      background: var(--bg-elevated); color: var(--text-primary);
      border: 1px dashed var(--accent-terracotta-border); border-radius: 4px;
      padding: 0.03em 0.38em; margin: 0 0.06em; font-family: var(--font-sans); font-size: 0.9em; font-weight: 500;
      line-height: 1.35; cursor: pointer; vertical-align: baseline; transition: background-color 140ms ease;
    }
    .term-chip::after { content: "?"; font-family: var(--font-mono); font-size: 0.72em; color: var(--accent-terracotta); margin-left: 0.15rem; }
    .term-chip:hover, .term-chip.open { background: var(--accent-terracotta-soft); border-style: solid; }
    .term-popover {
      display: block; margin: 0.55rem 0; padding: 0.65rem 0.9rem;
      background: var(--bg-elevated); border-left: 3px solid var(--accent-sand);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: 0.86rem; color: var(--text-primary);
    }

    /* 可选高密度原语 2：温暖素雅的契约/对照表 (.spec-table) */
    .spec-table-wrap { overflow-x: auto; margin: 1rem 0 1.25rem; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--bg-surface); }
    .spec-table { width: 100%; border-collapse: collapse; font-size: 0.87rem; text-align: left; }
    .spec-table th { background: var(--bg-elevated); color: var(--text-primary); font-weight: 600; padding: 0.65rem 0.85rem; border-bottom: 1px solid var(--border-strong); white-space: nowrap; }
    .spec-table td { padding: 0.62rem 0.85rem; border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary); vertical-align: top; }
    .spec-table tr:last-child td { border-bottom: none; }

    /* 可选高密度原语 3：底层深挖与语法小课堂折叠区 (.deep-dive) */
    .deep-dive {
      background: var(--bg-elevated); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); padding: 0.75rem 1rem; margin: 0.9rem 0;
    }
    .deep-dive summary { cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--text-primary); list-style: none; display: flex; align-items: center; gap: 0.5rem; }
    .deep-dive summary::-webkit-details-marker { display: none; }
    .deep-dive summary::before { content: "▸"; font-family: var(--font-mono); color: var(--accent-terracotta); transition: transform 150ms ease; }
    .deep-dive[open] summary::before { content: "▾"; }
    .deep-dive-body { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border-subtle); font-size: 0.89rem; color: var(--text-secondary); }
    .deep-dive-body p:last-child { margin-bottom: 0; }

    /* 可选高密度原语 4：紧凑因果流转带 (.causal-chain) */
    .causal-chain { display: flex; align-items: stretch; gap: 0.45rem; flex-wrap: wrap; margin: 1rem 0 1.25rem; }
    .causal-step {
      flex: 1; min-width: 140px; background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); padding: 0.7rem 0.85rem;
    }
    .causal-step-tag { font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent-terracotta); font-weight: 600; display: block; margin-bottom: 0.2rem; }
    .causal-step-title { font-size: 0.88rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.24rem; }
    .causal-step-desc { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.65; margin: 0; }
    .causal-arrow { display: flex; align-items: center; color: var(--accent-terracotta); font-family: var(--font-mono); font-weight: 600; }
    @media (max-width: 680px) { .causal-arrow { display: none; } }

    /* 可选高密度原语 5：微沙盘操作指引条 (.sandbox-guide) */
    .sandbox-guide {
      background: var(--bg-elevated); border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--accent-terracotta); border-radius: 0 var(--radius-md) var(--radius-md) 0;
      padding: 0.78rem 1rem; margin-bottom: 1rem; font-size: 0.86rem; color: var(--text-secondary);
    }
    .sandbox-guide-title { font-weight: 600; color: var(--text-primary); margin-bottom: 0.35rem; font-size: 0.86rem; }
    .sandbox-guide ol { margin: 0; padding-left: 1.25rem; }
    .sandbox-guide li { margin-bottom: 0.24rem; line-height: 1.65; }
    .sandbox-guide li:last-child { margin-bottom: 0; }

    /* ==========================================================================
       5. 代码精讲框 (多语言词法高亮 + 双向注解联动 + 双视图)
       ========================================================================== */
    .code-walkthrough { border: 1px solid var(--border-subtle); border-radius: var(--radius-md); overflow: hidden; background: var(--bg-code); margin: 1rem 0; }
    .code-topbar { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; padding: 0.55rem 0.9rem; background: var(--bg-elevated); border-bottom: 1px solid var(--border-subtle); }
    .code-actions { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
    .code-pre { margin: 0; padding: 0.75rem 0; overflow-x: auto; max-height: 460px; overflow-y: auto; line-height: 1.58; tab-size: 2; }
    .code-line { display: block; padding: 0 1rem 0 0; border-left: 3px solid transparent; transition: background-color 140ms ease; }
    .code-line .ln { display: inline-block; width: 3.1rem; padding-right: 0.85rem; text-align: right; color: var(--text-muted); user-select: none; font-size: 0.76rem; }
    .code-line.has-annot { cursor: pointer; }
    .code-line.has-annot .ln { color: var(--accent-terracotta); font-weight: 600; }
    .code-line.has-annot:hover { background: var(--bg-elevated); }
    .code-line.highlight { background: var(--accent-terracotta-soft); border-left-color: var(--accent-terracotta); }
    .code-line.focus-pulse { background: var(--accent-sand-soft); border-left-color: var(--accent-sand); }
    .code-line.is-collapsed-line { display: none; }

    .tok-kw { color: var(--syn-kw); font-weight: 500; }
    .tok-str { color: var(--syn-str); }
    .tok-num { color: var(--syn-num); }
    .tok-com { color: var(--syn-com); font-style: italic; }
    .tok-fn { color: var(--syn-fn); }
    .tok-tag { color: var(--syn-tag); }

    .annot-list { display: flex; flex-direction: column; gap: 0.5rem; margin: 0.75rem 0; }
    .annot-item {
      display: flex; gap: 0.7rem; align-items: flex-start; padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);
      background: var(--bg-surface); cursor: pointer; transition: all var(--duration-fast) var(--ease-out-expo);
    }
    .annot-item:hover, .annot-item.active { border-color: var(--accent-terracotta); background: var(--accent-terracotta-soft); }
    .annot-item p { margin: 0; font-size: 0.88rem; color: var(--text-primary); }

    /* ==========================================================================
       6. 终端模拟与折叠文件树
       ========================================================================== */
    .terminal-sim { background: var(--bg-terminal); color: #E5E3DE; border-radius: var(--radius-md); overflow: hidden; border: 1px solid #302E2B; margin: 1rem 0; }
    .terminal-bar { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.55rem 0.9rem; background: #23211F; border-bottom: 1px solid #302E2B; flex-wrap: wrap; }
    .terminal-dots { display: flex; gap: 0.38rem; }
    .terminal-dots span { width: 9px; height: 9px; border-radius: 50%; background: #4A4742; }
    .terminal-body { padding: 0.95rem 1.1rem; font-family: var(--font-mono); font-size: 0.82rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .term-cmd { color: #E5B47A; margin-bottom: 0.35rem; }
    .term-out { color: #D4D1CA; }

    .tree-root, .tree-children { list-style: none; padding-left: 0; margin: 0; }
    .tree-children { padding-left: 1.25rem; border-left: 1px dashed var(--border-strong); margin-left: 0.55rem; }
    .tree-item.collapsed > .tree-children { display: none; }
    .tree-row { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.28rem 0.5rem; border-radius: var(--radius-sm); cursor: pointer; }
    .tree-row:hover { background: var(--bg-elevated); }
    .tree-caret { font-family: var(--font-mono); font-size: 0.78rem; color: var(--accent-terracotta); width: 0.9rem; }

    /* ==========================================================================
       7. [项目专属样式区] — Agent 在此补充当前项目的定制可视化与微沙盘样式
       ========================================================================== */
    /* {{PROJECT_CUSTOM_CSS}} */
  </style>
</head>
<body data-project-slug="{{PROJECT_SLUG}}">

  <header class="mobile-topbar">
    <button class="fz-btn" onclick="fzToggleMobileNav()">☰ 目录导航</button>
    <strong style="font-family:var(--font-serif); font-size:0.95rem;">{{PROJECT_NAME}}</strong>
    <button class="fz-btn" onclick="toggleTheme()">◐ 主题</button>
  </header>

  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar">
      <div>
        <span class="brand-eyebrow">{{PROJECT_EYEBROW}}</span>
        <div class="brand-title">{{PROJECT_NAME}}</div>
        <p class="brand-sub">{{PROJECT_TAGLINE}}</p>
        <nav aria-label="章节目录">
          <ul class="nav-list" id="sidebar-nav"></ul>
        </nav>
      </div>

      <div>
        <div class="progress-box">
          <div class="progress-header">
            <span>实操完成进度</span>
            <span id="progress-label">0 / 0 步</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
        <div class="sidebar-actions">
          <button class="fz-btn" onclick="toggleTheme()" style="flex:1; justify-content:center;">◐ 深浅主题</button>
          <button class="fz-btn" onclick="resetProgress()" title="清空本地完成记录">↺ 重置</button>
        </div>
      </div>
    </aside>

    <main class="main-canvas" id="main-canvas">
      <!-- {{PROJECT_SECTIONS_HTML}} -->
    </main>
  </div>

  <!-- ==========================================================================
       8. 基座运行时辅助函数 (目录扫描 / ScrollSpy / 词法高亮 / 双向联动 / 术语微释义)
       注意：任何内嵌字符串中若出现关闭标签，必须转义为 <\/script> 或 <\/style>
       ========================================================================== -->
  <script>
    (function () {
      const slug = document.body.getAttribute("data-project-slug") || "from-zero-project";
      const STORAGE_KEY = `fz_progress_${slug}`;
      const THEME_KEY = "fz_theme_pref";
      let completedSteps = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));

      window.initTheme = function () {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
      };
      window.toggleTheme = function () {
        const cur = document.documentElement.getAttribute("data-theme") || "light";
        const next = cur === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem(THEME_KEY, next);
      };
      window.fzToggleMobileNav = function () { document.getElementById("app-sidebar")?.classList.toggle("open"); };

      window.fzBuildSidebar = function () {
        const navEl = document.getElementById("sidebar-nav");
        const sections = Array.from(document.querySelectorAll("#main-canvas > section[data-nav]"));
        if (!navEl || sections.length === 0) return;
        navEl.innerHTML = sections.map((sec, idx) => {
          const id = sec.id;
          const num = sec.getAttribute("data-num") || String(idx + 1).padStart(2, "0");
          const label = sec.getAttribute("data-nav");
          return `<li><a class="nav-link ${idx === 0 ? "active" : ""}" data-nav-target="${id}" href="#${id}"><span class="nav-num">${num}<\/span><span>${label}<\/span><\/a><\/li>`;
        }).join("");
        navEl.querySelectorAll(".nav-link").forEach(link => {
          link.addEventListener("click", () => {
            manualNavLockUntil = Date.now() + 650;
            setActiveNav(link.getAttribute("data-nav-target"));
            document.getElementById("app-sidebar")?.classList.remove("open");
          });
        });
      };

      let manualNavLockUntil = 0;
      function setActiveNav(sectionId) {
        document.querySelectorAll("#sidebar-nav .nav-link").forEach(link => {
          link.classList.toggle("active", link.getAttribute("data-nav-target") === sectionId);
        });
      }
      window.updateScrollSpy = function () {
        if (Date.now() < manualNavLockUntil) return;
        const sections = Array.from(document.querySelectorAll("#main-canvas > section[data-nav]"));
        if (sections.length === 0) return;
        if ((window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 40)) {
          setActiveNav(sections[sections.length - 1].id);
          return;
        }
        const triggerLine = window.innerHeight * 0.28;
        let currentId = sections[0].id;
        for (const sec of sections) {
          if (sec.getBoundingClientRect().top <= triggerLine) currentId = sec.id;
          else break;
        }
        setActiveNav(currentId);
      };
      let scrollTicking = false;
      window.addEventListener("scroll", () => {
        if (!scrollTicking) {
          window.requestAnimationFrame(() => { window.updateScrollSpy(); scrollTicking = false; });
          scrollTicking = true;
        }
      }, { passive: true });

      window.updateProgressUI = function () {
        const boxes = Array.from(document.querySelectorAll("input[type='checkbox'][data-step-id]"));
        const total = boxes.length;
        const done = boxes.filter(b => completedSteps.has(b.getAttribute("data-step-id"))).length;
        const pct = total ? Math.round((done / total) * 100) : 0;
        const label = document.getElementById("progress-label");
        const fill = document.getElementById("progress-fill");
        if (label) label.textContent = `${done} / ${total} 步已完成`;
        if (fill) fill.style.width = `${pct}%`;
      };
      window.fzInitProgress = function () {
        document.querySelectorAll("input[type='checkbox'][data-step-id]").forEach(box => {
          const stepId = box.getAttribute("data-step-id");
          box.checked = completedSteps.has(stepId);
          box.addEventListener("change", () => {
            if (box.checked) completedSteps.add(stepId);
            else completedSteps.delete(stepId);
            localStorage.setItem(STORAGE_KEY, JSON.stringify([...completedSteps]));
            window.updateProgressUI();
          });
        });
        window.updateProgressUI();
      };
      window.resetProgress = function () {
        completedSteps.clear();
        localStorage.setItem(STORAGE_KEY, "[]");
        document.querySelectorAll("input[type='checkbox'][data-step-id]").forEach(b => { b.checked = false; });
        window.updateProgressUI();
      };

      window.fzCopyText = function (text, btn) {
        const done = () => { if (!btn) return; const old = btn.textContent; btn.textContent = "✓ 已复制"; setTimeout(() => { btn.textContent = old; }, 1400); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
        else fallbackCopy(text, done);
      };
      function fallbackCopy(text, cb) {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta); cb();
      }

      // 词法高亮器（单遍扫描注释与字符串，修复 URL 含 // 截断与实体字符串高亮问题）
      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      window.fzHighlightLine = function (rawLine, lang) {
        let html = esc(rawLine);
        const tokens = [];
        const stash = (cls, match) => {
          const id = `___FZTOK_${tokens.length}___`;
          tokens.push(`<span class="${cls}">${match}<\/span>`);
          return id;
        };

        const strPat = "&quot;(?:\\\\&quot;|(?!&quot;).)*?&quot;|'(?:\\\\'|[^'])*?'|`(?:\\\\`|[^`])*?`";
        if (lang === "py" || lang === "bash") {
          html = html.replace(new RegExp(`(#.*$)|(${strPat})`, "g"), (m, com, str) =>
            com ? stash("tok-com", com) : stash("tok-str", str)
          );
        } else if (lang === "html") {
          html = html.replace(new RegExp(`(&lt;!--[\\s\\S]*?--&gt;)|(${strPat})`, "g"), (m, com, str) =>
            com ? stash("tok-com", com) : stash("tok-str", str)
          );
        } else if (lang === "json") {
          html = html.replace(/(&quot;(?:\\&quot;|(?!&quot;).)*?&quot;)(\s*:)?/g, (_, k, colon) =>
            colon ? stash("tok-fn", k) + colon : stash("tok-str", k)
          );
        } else {
          html = html.replace(new RegExp(`(\\/\\/.*$|\\/\\*[\\s\\S]*?\\*\\/)|(${strPat})`, "g"), (m, com, str) =>
            com ? stash("tok-com", com) : stash("tok-str", str)
          );
        }

        if (lang === "html") {
          html = html.replace(/(&lt;\/?[a-zA-Z0-9-]+)/g, '<span class="tok-tag">$1<\/span>');
          html = html.replace(/(\/?&gt;)/g, '<span class="tok-tag">$1<\/span>');
        } else if (lang === "css") {
          html = html.replace(/(^|[\s{;])([a-z-]+)(\s*:)/g, '$1<span class="tok-fn">$2<\/span>$3');
        } else if (lang !== "json") {
          html = html.replace(/\b(const|let|var|function|async|await|return|import|export|from|default|if|elif|else|for|of|in|while|try|except|finally|with|as|pass|continue|break|yield|raise|and|or|not|is|None|True|False|catch|new|class|def|true|false|null|undefined|SELECT|INSERT|INTO|VALUES|UPDATE|SET|CASE|WHEN|THEN|ELSE|END|DELETE|FROM|WHERE|ORDER|BY|DESC|CREATE|TABLE|IF|NOT|EXISTS|PRIMARY|KEY|AUTOINCREMENT|INTEGER|TEXT)\b/g,
            '<span class="tok-kw">$1<\/span>');
        } else {
          html = html.replace(/\b(true|false|null)\b/g, '<span class="tok-kw">$1<\/span>');
        }

        html = html.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-num">$1<\/span>');
        html = html.replace(/___FZTOK_(\d+)___/g, (_, idx) => tokens[Number(idx)]);
        return html;
      };

      function parseLineSpec(spec) {
        const set = new Set();
        String(spec || "").split(",").forEach(part => {
          const p = part.trim();
          if (!p) return;
          if (p.includes("-")) {
            const [a, b] = p.split("-").map(n => parseInt(n.trim(), 10));
            if (a && b) for (let k = a; k <= b; k++) set.add(k);
          } else {
            const n = parseInt(p, 10);
            if (n) set.add(n);
          }
        });
        return set;
      }

      // 真正的双向联动：注解 <-> 代码行
      window.fzInitCodeWalkthroughs = function () {
        document.querySelectorAll(".code-walkthrough").forEach(box => {
          const codeEl = box.querySelector("pre.code-pre code");
          if (!codeEl) return;

          const rawText = codeEl.textContent.replace(/^\n+|\n+$/g, "");
          const lang = box.getAttribute("data-lang") || "js";
          const hlSet = new Set((box.getAttribute("data-highlight") || "").split(",").map(s => parseInt(s.trim(), 10)).filter(Boolean));

          const focusAttr = box.getAttribute("data-focus");
          let focusRange = null;
          if (focusAttr && focusAttr.includes("-")) {
            const [s, e] = focusAttr.split("-").map(n => parseInt(n.trim(), 10));
            if (s && e) focusRange = [s, e];
          }

          const scope = box.parentElement;
          const annotItems = Array.from(scope?.querySelectorAll(".annot-item[data-lines]") || []);
          const lineToAnnots = new Map();
          annotItems.forEach(item => {
            const lines = parseLineSpec(item.getAttribute("data-lines"));
            lines.forEach(ln => {
              if (!lineToAnnots.has(ln)) lineToAnnots.set(ln, []);
              lineToAnnots.get(ln).push(item);
            });
          });

          codeEl.innerHTML = rawText.split("\n").map((line, i) => {
            const ln = i + 1;
            const isHl = hlSet.has(ln) ? "highlight" : "";
            const hasAnnot = lineToAnnots.has(ln) ? "has-annot" : "";
            const titleAttr = hasAnnot ? ' title="点击定位对应代码注解"' : "";
            return `<span class="code-line ${isHl} ${hasAnnot}" data-line="${ln}"${titleAttr}><span class="ln">${ln}<\/span>${window.fzHighlightLine(line, lang)}<\/span>`;
          }).join("");

          const copyBtn = box.querySelector("[data-copy-code]");
          if (copyBtn) copyBtn.addEventListener("click", () => window.fzCopyText(rawText, copyBtn));

          const viewBtn = box.querySelector("[data-toggle-view]");
          if (viewBtn && focusRange) {
            let focusMode = false;
            viewBtn.addEventListener("click", () => {
              focusMode = !focusMode;
              codeEl.querySelectorAll(".code-line").forEach(el => {
                const ln = parseInt(el.getAttribute("data-line"), 10);
                el.classList.toggle("is-collapsed-line", focusMode && (ln < focusRange[0] || ln > focusRange[1]));
              });
              viewBtn.textContent = focusMode ? "展开完整文件" : `仅看核心行 (L${focusRange[0]}-L${focusRange[1]})`;
            });
          } else if (viewBtn) {
            viewBtn.style.display = "none";
          }

          const activateLines = (targetSet, scrollCode) => {
            let firstEl = null;
            codeEl.querySelectorAll(".code-line").forEach(el => {
              const ln = parseInt(el.getAttribute("data-line"), 10);
              const hit = targetSet.has(ln);
              el.classList.toggle("focus-pulse", hit);
              if (hit) {
                if (scrollCode) el.classList.remove("is-collapsed-line");
                if (!firstEl) firstEl = el;
              }
            });
            if (scrollCode && firstEl) {
              firstEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
            }
          };

          // 方向 1：点击注解 -> 高亮并滚动代码行
          annotItems.forEach(item => {
            item.addEventListener("click", () => {
              annotItems.forEach(a => a.classList.remove("active"));
              item.classList.add("active");
              activateLines(parseLineSpec(item.getAttribute("data-lines")), true);
            });
          });

          // 方向 2：点击有注解的代码行 -> 反向高亮并滚动到对应注解
          codeEl.querySelectorAll(".code-line.has-annot").forEach(lineEl => {
            lineEl.addEventListener("click", () => {
              const ln = parseInt(lineEl.getAttribute("data-line"), 10);
              const matched = lineToAnnots.get(ln) || [];
              if (!matched.length) return;
              annotItems.forEach(a => a.classList.remove("active"));
              matched.forEach(a => a.classList.add("active"));
              activateLines(parseLineSpec(matched[0].getAttribute("data-lines")), false);
              matched[0].scrollIntoView({ block: "nearest", behavior: "smooth" });
            });
          });
        });
      };

      // 行内术语微释义 (.term-chip[data-term-tip]) 原地展开
      window.fzInitTermChips = function () {
        document.querySelectorAll(".term-chip[data-term-tip]").forEach(chip => {
          chip.setAttribute("type", "button");
          chip.setAttribute("aria-expanded", "false");
          chip.addEventListener("click", () => {
            const existing = chip.nextElementSibling;
            if (existing && existing.classList.contains("term-popover") && existing.dataset.forTerm === chip.textContent) {
              existing.remove();
              chip.classList.remove("open");
              chip.setAttribute("aria-expanded", "false");
              return;
            }
            const pop = document.createElement("span");
            pop.className = "term-popover";
            pop.dataset.forTerm = chip.textContent;
            pop.textContent = `${chip.textContent}：${chip.getAttribute("data-term-tip")}`;
            chip.insertAdjacentElement("afterend", pop);
            chip.classList.add("open");
            chip.setAttribute("aria-expanded", "true");
          });
        });
      };

      window.fzToggleTree = function (rowEl) {
        const li = rowEl.parentElement;
        if (!li || !li.querySelector(".tree-children")) return;
        li.classList.toggle("collapsed");
        const caret = rowEl.querySelector(".tree-caret");
        if (caret) caret.textContent = li.classList.contains("collapsed") ? "▸" : "▾";
      };

      document.addEventListener("DOMContentLoaded", () => {
        window.initTheme();
        window.fzBuildSidebar();
        window.fzInitProgress();
        window.fzInitCodeWalkthroughs();
        window.fzInitTermChips();
        window.updateScrollSpy();
      });
    })();
  </script>
  <!-- {{PROJECT_CUSTOM_JS}} -->
</body>
</html>
